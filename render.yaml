services:
  - type: web
    name: consultorio-psicologico
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: SECRET_KEY
        generateValue: true
      # Ruta relativa al directorio de trabajo. Si se monta un disco
      # persistente en Render, cambiar a <mount>/consultorio.db
      - key: DATABASE_PATH
        value: data/consultorio.db
    healthCheckPath: /
