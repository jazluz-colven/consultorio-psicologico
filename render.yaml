services:
  - type: web
    name: consultorio-psicologico
    runtime: python
    # Spec 019 (T14, RNF-3): misma región que Neon Free (aws-us-east-2).
    region: ohio
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: SECRET_KEY
        generateValue: true
      # DSN de Neon (endpoint directo, sin -pooler). Se configura como secreto
      # en el panel de Render; nunca se versiona en este archivo.
      - key: DATABASE_URL
        sync: false
    healthCheckPath: /
