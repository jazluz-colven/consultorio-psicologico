<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}{{ view.brand_name }}{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
</head>
<body>
    <header class="site-header">
        <a class="site-brand" href="{{ url_for('home.index') }}">
            <img class="site-brand__logo"
                 src="{{ url_for('static', filename='img/hero-contenidas.png') }}"
                 alt="Contenidas" width="720" height="713">
            <span class="site-brand__name">{{ view.brand_name }}</span>
        </a>
        <button class="nav-toggle" type="button" aria-label="Abrir menú"
                aria-expanded="false" aria-controls="site-nav">Menú</button>
        <nav id="site-nav" class="site-nav" aria-label="Navegación principal">
            <ul>
                {% for item in view.nav %}
                <li><a href="{{ item.url }}">{{ item.label }}</a></li>
                {% endfor %}
            </ul>
        </nav>
        <form class="site-search" action="{{ url_for('search.index') }}" method="get" role="search">
            <label class="site-search__label" for="search-input">Buscar en el sitio</label>
            <input class="site-search__input" id="search-input" type="search"
                   name="q" placeholder="Buscar en el sitio…"
                   value="{{ search_q|default('', true) }}">
            <button class="site-search__button" type="submit">Buscar</button>
        </form>
    </header>

    <main class="site-main">
        {% block content %}{% endblock %}
    </main>

    <footer class="site-footer">
        <p>{{ view.brand_name }} · {{ view.secondary_brand }}</p>
    </footer>
    <script src="{{ url_for('static', filename='js/nav.js') }}"></script>
</body>
</html>
