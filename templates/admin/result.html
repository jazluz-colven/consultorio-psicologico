{% extends "base.html" %}

{% block title %}{{ page_title }} — {{ view.brand_name }}{% endblock %}

{% block content %}
<article class="appointment">
    <h1 class="appointment__title">{{ page_title }}</h1>

    <p class="cancellation__notice" role="alert">{{ message }}</p>

    <p class="appointment__back">
        <a class="cancellation__back-link" href="{{ url_for('appointments.index') }}">{{ back_button }}</a>
    </p>
</article>
{% endblock %}
